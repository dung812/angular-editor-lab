<angular-editor
  id="editor-test"
  [(ngModel)]="htmlContent"
  [config]="editorConfig">
</angular-editor>

<div class="lab-actions">
  <button type="button" (click)="onReformatContent()">Reformat</button>
  <button type="button" (click)="onSubmitContent()">Submit</button>
</div>

<ul class="lab-errors" *ngIf="pdfValidationErrors.length > 0">
  <li *ngFor="let error of pdfValidationErrors">{{ error }}</li>
</ul>

<pre class="lab-output">{{ htmlContent }}</pre>
